app:
  lh-cluster-id: cluster1
  server:
    port: 8080
  tenants:
    - name: default
      wfSpecs:
        - example-external-event
        - output-topic
        - await-wf-event
        - example-variables
        - it-request
      userTaskDefs:
        - approve-it-request
        - it-request
      externalEventDefs:
        - name-event
      workflowEventDefs:
        - sleep-done

kafka:
  streams:
    application.id: ${app.lh-cluster-id}-wf-diffuser
    bootstrap.servers: localhost:9092
    #schema.registry.url: http://localhost:8081/apis/registry/v2
    auto.offset.reset: latest
    default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
    ensure.explicit.internal.resource.naming: true
    num.stream.threads: 2



