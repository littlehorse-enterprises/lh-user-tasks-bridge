# See https://pre-commit.com for more information.
fail_fast: true
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shell script files
        stages: [pre-commit]
        args: [-e, SC1091]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: check commit message format
        stages: [commit-msg]
        args:
          [
            --strict,
            --force-scope,
            --verbose,
            feat,
            fix,
            docs,
            style,
            refactor,
            perf,
            test,
            build,
            ci,
            chore,
            revert,
          ]

  - repo: local
    hooks:
      - id: java-test
        name: run unit tests
        stages: [pre-commit]
        language: system
        always_run: true
        pass_filenames: false
        entry: ./gradlew test

      - id: java-integration-test
        name: run integration tests
        stages: [pre-commit]
        language: system
        always_run: true
        pass_filenames: false
        entry: ./gradlew integrationTest

      - id: java-build
        name: build distribution
        stages: [pre-commit]
        language: system
        always_run: true
        pass_filenames: false
        entry: ./gradlew build installDist -x test
