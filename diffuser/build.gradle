plugins {
    id "java-library"
    id "application"
    id "io.spring.dependency-management" version "1.1.7"
}

// Keep this module usable both in the console build and through its own wrapper.
def diffuserProperties = new Properties()
file("gradle.properties").withInputStream { diffuserProperties.load(it) }
diffuserProperties.each { key, value ->
    if (key != "group" && key != "version" && !project.hasProperty(key.toString())) {
        ext.set(key.toString(), value)
    }
}

if (project == rootProject) {
    group = providers.gradleProperty("group").get()
    version = providers.gradleProperty("version").get()
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent { snapshotsOnly() }
        content { includeGroup "io.littlehorse" }
    }
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.9"
    }
}

dependencies {
    // Kafka Streams
    api "org.apache.kafka:kafka-streams:${kafkaVersion}"

    // SmallRye Config
    api "io.smallrye.config:smallrye-config:${smallryeConfigVersion}"
    implementation "io.smallrye.config:smallrye-config-source-yaml:${smallryeConfigVersion}"

    // Metrics
    api "io.micrometer:micrometer-registry-prometheus:${micrometerVersion}"

    // LittleHorse Client (protobuf models)
    implementation("io.littlehorse:littlehorse-client:${littlehorseVersion}") {
        changing = true
    }

    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Apicurio Registry SerDe
    implementation "io.apicurio:apicurio-registry-jsonschema-serde-kafka:${apicurioVersion}"

    // Logging
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Tests
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.apache.kafka:kafka-streams-test-utils:${kafkaVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
    testImplementation "org.apache.kafka:kafka-clients:${kafkaVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
    applicationName = "lh-workflow-diffuser"
    mainClass = "io.littlehorse.streamsense.diffuser.WorkflowDiffuserApp"
}

tasks.test {
    useJUnitPlatform {
        excludeTags "integration"
    }
}

tasks.register("integrationTest", Test) {
    useJUnitPlatform {
        includeTags "integration"
    }
    description = "Runs integration tests (requires Docker)"
    group = "verification"
    classpath = sourceSets.test.runtimeClasspath
    testClassesDirs = sourceSets.test.output.classesDirs
}

tasks.register("dockerComposeUp", Exec) {
    description = "Starts the local Docker Compose environment."
    group = "application"
    commandLine "docker", "compose", "up", "-d"
    workingDir projectDir
    environment "LH_VERSION", littlehorseVersion
}

tasks.register("dockerComposeDown", Exec) {
    description = "Stops the local Docker Compose environment and removes its volumes."
    group = "application"
    commandLine "docker", "compose", "down", "-v"
    workingDir projectDir
    environment "LH_VERSION", littlehorseVersion
}
