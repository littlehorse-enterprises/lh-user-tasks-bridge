name: lh-wf-diffuser

services:
  lh-kafka:
    container_name: lh-kafka
    hostname: lh-kafka
    image: confluentinc/cp-kafka:7.9.0
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://lh-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@lh-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://lh-kafka:29092,CONTROLLER://lh-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "/bin/kafka-topics", "--bootstrap-server=localhost:9092", "--list"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - wfd-network

  lh-server:
    container_name: lh-server
    hostname: lh-server
    image: ghcr.io/littlehorse-enterprises/littlehorse/lh-server:${LH_VERSION}
    environment:
      LHS_KAFKA_BOOTSTRAP_SERVERS: lh-kafka:29092
      LHS_SHOULD_CREATE_TOPICS: "true"
      LHS_HEALTH_SERVICE_PORT: "1822"
    restart: on-failure
    healthcheck:
      test: curl -f localhost:1822/liveness
      interval: 5s
    depends_on:
      lh-kafka:
        condition: service_healthy
    ports:
      - "2023:2023"
    networks:
      - wfd-network

  lh-dashboard:
    container_name: lh-dashboard
    hostname: lh-dashboard
    image: ghcr.io/littlehorse-enterprises/littlehorse/lh-dashboard:${LH_VERSION}
    environment:
      LHC_API_HOST: lh-server
      LHC_API_PORT: 2023
      LHD_OAUTH_ENABLED: false
    restart: on-failure
    healthcheck:
      test: wget --fail localhost:3000
      interval: 5s
    ports:
      - "8080:3000"
    networks:
      - wfd-network

  lh-apicurio:
    container_name: lh-apicurio
    hostname: lh-apicurio
    image: apicurio/apicurio-registry:3.1.7
    ports:
      - "8085:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: lh-kafka:29092
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:8086
    depends_on:
      lh-kafka:
        condition: service_healthy
    networks:
      - wfd-network

  lh-apicurio-ui:
    container_name: lh-apicurio-ui
    hostname: lh-apicurio-ui
    image: apicurio/apicurio-registry-ui:3.1.7
    ports:
      - "8086:8080"
    environment:
      REGISTRY_API_URL: http://localhost:8085/apis/registry/v3
    depends_on:
      - lh-apicurio
    networks:
      - wfd-network

  lh-kafka-ui:
    container_name: lh-kafka-ui
    hostname: lh-kafka-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lh-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: lh-kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://lh-apicurio:8080/apis/ccompat/v7
    depends_on:
      lh-kafka:
        condition: service_healthy
    networks:
      - wfd-network

networks:
  wfd-network:
    driver: bridge
