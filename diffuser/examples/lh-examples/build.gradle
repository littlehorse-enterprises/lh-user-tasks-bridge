plugins {
    id "java"
    id "application"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent { snapshotsOnly() }
        content { includeGroup "io.littlehorse" }
    }
    mavenLocal()
}

dependencies {
    implementation("io.littlehorse:littlehorse-client:${littlehorseVersion}") {
        changing = true
    }
    implementation "org.slf4j:slf4j-api:${parent.slf4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${parent.log4jVersion}"
    implementation "org.apache.commons:commons-lang3:${parent.commonsLangVersion}"
}

application {
    mainClass = "io.littlehorse.examples.ExampleRunner"
}
