name: release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew build installDist

      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Build and publish release images
        uses: littlehorse-enterprises/publish-image@v1
        with:
          image-name: lh-workflow-diffuser
          dockerfile: Dockerfile
          registry: github,ecr
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ghcr-root: true

      - name: Check diff
        run: |
          git diff HEAD --exit-code || (echo "Uncommitted changes found" && exit 1)
