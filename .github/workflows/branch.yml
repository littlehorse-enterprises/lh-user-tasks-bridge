name: branch
run-name: Publish branch image for ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew build installDist

      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Build and publish to ECR
        uses: littlehorse-enterprises/publish-image@v1
        with:
          image-name: lh-workflow-diffuser
          dockerfile: Dockerfile
          registry: ecr
          prefix: branch-

      - name: Check diff
        run: |
          git diff HEAD --exit-code || (echo "Uncommitted changes found" && exit 1)
