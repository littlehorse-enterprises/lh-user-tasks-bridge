plugins {
    id 'application'
    id 'com.gradleup.shadow'
}

dependencies {
    implementation "io.littlehorse:littlehorse-client:${littlehorseVersion}"
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
}

application {
    mainClass = 'io.littlehorse.Main'
}

shadowJar {
    // Docker and setup scripts use this stable filename.
    archiveFileName = 'lh-user-tasks-bridge-demo-all.jar'
    // Keep all service descriptors for merging, including gRPC's DNS resolver.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    filesNotMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    mergeServiceFiles()
}